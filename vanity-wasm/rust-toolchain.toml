# Pinned so `npm run build:wasm` builds with the same Rust locally and in CI.
# CI rebuilds the artifact from source and runs its test suite (the artifact
# is committed back after merges). Builds are path-independent; byte identity
# across machines additionally needs the same clang for the vendored C, which
# is what the pinned dev image provides (the reproduce CI job checks identity
# across staging paths inside it).
[toolchain]
channel = "1.95.0"
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
