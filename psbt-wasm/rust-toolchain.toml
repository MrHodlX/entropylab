# Pinned so `npm run build:wasm` builds with the same Rust locally and in CI.
# CI rebuilds the artifact from source inside the digest-pinned Dockerfile.wasm
# image (pinned clang + Rust), builds it twice from scratch, and fails unless
# both runs are byte-identical; the artifact is committed back after merges.
[toolchain]
channel = "1.95.0"
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
